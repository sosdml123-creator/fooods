workflows:
  ios-release:
    name: iOS App Store Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: mobile_app
    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - mobile_app/build/ios/ipa/*.ipa
