name: iOS App Store Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS Release App (Unsigned)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Package IPA File
        run: |
          cd mobile_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../plating.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: mobile_app/plating.ipa

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cat << 'EOF' > ~/.appstoreconnect/private_keys/AuthKey_Y4ARXJYB3K.p8
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgUCWEMaVMiyftL6d8
          FojhlgRohwmrLB9Yp6QFSd/PfuqgCgYIKoZIzj0DAQehRANCAASq3pZmEYD3s+1L
          wDcdTtDGuFUitBCo7wEzLAcOcLFR9hfNJYuYoudLSvsneRBObpoeQwoBtKKEYnhh
          C+lN7qlk
          -----END PRIVATE KEY-----
          EOF

      - name: Upload Build to App Store Connect
        run: |
          xcrun altool --upload-app -f mobile_app/plating.ipa -t ios --apiKey Y4ARXJYB3K --apiIssuer fbf3bd0d-0e16-4dea-9f5a-0ae313aa0d68
