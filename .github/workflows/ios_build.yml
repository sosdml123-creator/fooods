name: iOS App Store Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Import Signing Certificate (.p12) and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH

          # 2. Decode and import p12 certificate
          echo "P12_BASE64 length: ${#P12_BASE64}"
          echo "$P12_BASE64" | tr -d '\r\n' | base64 --decode > $HOME/certificate.p12
          ls -la $HOME/certificate.p12
          file $HOME/certificate.p12
          security import $HOME/certificate.p12 -k $KEYCHAIN_PATH -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH

          # 3. Decode and install Provisioning Profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$MOBILEPROVISION_BASE64" | tr -d '\r\n' | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/food.mobileprovision"

      - name: Build iOS Release App
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Code Sign and Package IPA File
        run: |
          cd mobile_app/build/ios/iphoneos
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/food.mobileprovision" Runner.app/embedded.mobileprovision
          
          # Find signing identity from keychain
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -n 1 | awk -F '"' '{print $2}')
          if [ -n "$IDENTITY" ]; then
            echo "Signing with identity: $IDENTITY"
            if [ -d "Runner.app/Frameworks" ]; then
              find Runner.app/Frameworks -name "*.framework" -o -name "*.dylib" | while read -r framework; do
                codesign --force --sign "$IDENTITY" --timestamp=none "$framework"
              done
            fi

            # Extract entitlements from provisioning profile
            PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/food.mobileprovision"
            security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
            /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/profile.plist > /tmp/entitlements.plist
            cat /tmp/entitlements.plist

            codesign --force --sign "$IDENTITY" --timestamp=none --entitlements /tmp/entitlements.plist Runner.app
            codesign --verify --deep --strict --verbose=2 Runner.app
          fi

          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../plating.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: mobile_app/plating.ipa

      - name: Upload Build to App Store Connect
        run: |
          xcrun altool --upload-app -f mobile_app/plating.ipa -t ios --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}