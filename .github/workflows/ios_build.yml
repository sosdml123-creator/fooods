name: iOS App Store Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cat << 'EOF' > ~/.appstoreconnect/private_keys/AuthKey_Y4ARXJYB3K.p8
-----BEGIN PRIVATE KEY-----
MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgUCWEMaVMiyftL6d8
FojhlgRohwmrLB9Yp6QFSd/PfuqgCgYIKoZIzj0DAQehRANCAASq3pZmEYD3s+1L
wDcdTtDGuFUitBCo7wEzLAcOcLFR9hfNJYuYoudLSvsneRBObpoeQwoBtKKEYnhh
C+lN7qlk
-----END PRIVATE KEY-----
EOF

      - name: Import Signing Certificate (.p12) and Provisioning Profile
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$HOME/Library/Keychains/build.keychain-db
          security create-keychain -p "buildpass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 3600 $KEYCHAIN_PATH
          security unlock-keychain -p "buildpass" $KEYCHAIN_PATH

          # 2. Decode and import p12 certificate
          echo "" | base64 --decode > $HOME/certificate.p12
          security import $HOME/certificate.p12 -k $KEYCHAIN_PATH -P "1234" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "buildpass" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH

          # 3. Decode and install Provisioning Profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/food.mobileprovision"

      - name: Build iOS Release App
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Code Sign and Package IPA File
        run: |
          cd mobile_app/build/ios/iphoneos
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/food.mobileprovision" Runner.app/embedded.mobileprovision
          
          # Find signing identity from keychain
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -n 1 | awk -F '"' '{print $2}')
          if [ -n "$IDENTITY" ]; then
            echo "Signing with identity: $IDENTITY"
            codesign --force --sign "$IDENTITY" --deep Runner.app
          fi

          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../plating.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: mobile_app/plating.ipa

      - name: Upload Build to App Store Connect
        run: |
          xcrun altool --upload-app -f mobile_app/plating.ipa -t ios --apiKey Y4ARXJYB3K --apiIssuer fbf3bd0d-0e16-4dea-9f5a-0ae313aa0d68